<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>Screensaver</title>
 
</head>
<body class="body2">

    <!--MESSAGE FOR THE READERS OF THE SOURCE CODE, I admit it, I had help with AI for this script, sorry for that! But anyway, I need to say that this page if for a friend, so don't expect this page to be useful ! Thank you :3-->
    <h1 class="screensaverbktitle">Boing, boing, boykisser boing !</h1>
    <img id="dvd-logo" src="images/boykisser-spin.gif" style="position: fixed; width: 300px;" class="screensaverbk">

    <script>
    const logo = document.getElementById("dvd-logo");

    let x = 0, y = 0;
    let dx = 5, dy = 5; 

    function animate() {
        const logoWidth = logo.offsetWidth;
        const logoHeight = logo.offsetHeight;

        x += dx;
        y += dy;

        if (x <= 0 || x + logoWidth >= window.innerWidth) {
            dx = -dx;
        }
        if (y <= 0 || y + logoHeight >= window.innerHeight) {
            dy = -dy;
        }

        logo.style.left = x + "px";
        logo.style.top = y + "px";

        requestAnimationFrame(animate);
    }

    animate();
    </script>

</body>
</html>
